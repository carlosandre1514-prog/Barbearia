/* ===== ImageKit (envio assinado) ===== */
const shrinkB=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("img")),"image/jpeg",.82)};i.src=r.result};r.readAsDataURL(f)});
async function uploadImg(f){
 if(!IK.signer){tip("Envio de fotos ainda não configurado (ImageKit).");return null}
 const b=await shrinkB(f),a=await(await fetch(IK.signer)).json(),fd=new FormData();
 fd.append("file",b);fd.append("fileName","ab_"+Date.now()+".jpg");fd.append("publicKey",a.publicKey);fd.append("signature",a.signature);fd.append("expire",a.expire);fd.append("token",a.token);fd.append("folder","/agenda-barba");
 const r=await fetch("https://upload.imagekit.io/api/v1/files/upload",{method:"POST",body:fd}),j=await r.json();
 if(!r.ok)throw new Error(j.message||"upload");return j.url}

 if(S.justIn){S.justIn=0;S.role="cliente";S.v=S.ret||"home";S.ret=null;tip("Bem-vindo, "+S.user.nome);rebuild();R_();return}
 refresh();
});

 if(a==="login"){const m=$("#le").value.trim().toLowerCase(),p=$("#ls").value;if(!m||!p)return go(()=>{S.err="Informe e-mail e senha."});
  S.justIn=1;signInWithEmailAndPassword(auth,m,p).catch(er=>{S.justIn=0;go(()=>{S.err=aerr(er)})});return}

 if(a==="cx"){const x=A(d.id);if(!x)return;const b=writeBatch(fdb);b.update(ref("ag",x.id),{st:"cancelado"});if(x.st==="confirmado")b.delete(ref("busy",x.id));b.commit().then(()=>tip("Agendamento cancelado")).catch(fail);return}

 if(a==="rate"){const v=+prompt("Nota de 1 a 5");if(!(Number.isInteger(v)&&v>=1&&v<=5))return;const x=A(d.id);if(!x)return;const s=sh(x.shopId),b=writeBatch(fdb);

 if(a==="ot")return go(()=>{S.ot=d.t});

 if(a==="ok"){const s=me(),x=A(d.id);if(!x)return;
  if(!fits(s,x.d,x.h)){updateDoc(ref("ag",x.id),{st:"recusado"}).catch(fail);return tip("Horário já ocupado: pedido recusado")}
  const b=writeBatch(fdb);b.update(ref("ag",x.id),{st:"confirmado"});b.set(ref("busy",x.id),{shopId:s.id,u:x.u,d:x.d,h:x.h,m:x.m});let c=0;

 if(a==="no"){updateDoc(ref("ag",d.id),{st:"recusado"}).then(()=>tip("Pedido recusado")).catch(fail);return}
 if(a==="addsv"){const s=me(),n=$("#sn").value.trim(),p=parseFloat($("#sp").value.replace(",",".")),m=parseInt($("#sm").value);

 if(a==="mk"){const g=i=>$("#"+i).value.trim(),n=g("cn"),u=$("#cu").value,c=g("cc"),em=g("de").toLowerCase(),pw=$("#dp").value,dn=g("dn"),ce=g("ce"),tp=$("#ct").value;
