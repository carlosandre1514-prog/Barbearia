/* ===== MAPA DE NAVEGAÇÃO ===== */

 return`<button class="bt s m" data-a="role" data-r="cliente" style="margin-top:14px">← Voltar ao site</button><h1>Mapa de navegação</h1><p class="mu">Toque em uma tela para abrir. Quem faz cada coisa e em qual ordem.</p>
 ${row("Cliente",[ch("Início","cliente","home"),ch("Local","cliente","shop"),ch("Serviço","cliente","shop"),ch("Profissional","cliente","shop"),ch("Dia e horário","cliente","shop"),ch("Dados","cliente","shop"),ch("Login*","cliente","login"),ch("Pendente","cliente","mine")])}
 <p class="mu">*Login só é exigido ao solicitar o agendamento.</p>
 ${row("Empresa",[ch("Login único","cliente","login"),ch("Botão Minha empresa","dono","o"),ch("Agenda","dono","o"),ch("Equipe e horários","dono","o"),ch("Serviços","dono","o"),ch("Perfil e pagamento","dono","o"),ch("Resumo","dono","o")])}
 ${row("Administrador",[ch("Login único","cliente","login"),ch("Botão ADM","admin","a"),ch("Empresas","admin","a"),ch("Criar login","admin","a"),ch("Estados","admin","a")])}
 <h2>Regras da agenda</h2><div class="cd mu" style="line-height:1.7">1. Cliente escolhe o serviço na página da empresa, depois o profissional, depois o dia e o horário, depois confirma os dados.<br>2. O pedido nasce <b>pendente</b> e não bloqueia a agenda.<br>3. Ao <b>confirmar</b>, o intervalo (início + duração em min) fica ocupado em tempo real.<br>4. Pedidos pendentes que começam dentro do horário confirmado são recusados na hora.<br>5. Nenhum serviço é bloqueado pela duração: o cliente escolhe qualquer horário livre e a empresa decide ao confirmar.<br>6. Admin cria e redefine o acesso da empresa; a empresa não troca a senha.<br>7. O pagamento é no local, na hora. Cada empresa marca no Perfil quais formas aceita (dinheiro, Pix, débito, crédito) e o cliente escolhe uma ao agendar.<br>8. Existe um único login. O sistema reconhece o e-mail: o administrador vê o botão ADM, a empresa vê Minha empresa e o cliente comum não vê nenhum botão extra. Sem login, nada disso aparece.<br>9. Cada profissional tem os próprios horários, folgas e agenda. O cliente escolhe o profissional antes de ver os horários.</div>`}
