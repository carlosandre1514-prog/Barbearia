let PAUSA=0;
addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".trk"))PAUSA=Date.now()+9000});
setInterval(()=>{const t=document.querySelector("#car .trk");if(!t||document.hidden||Date.now()<PAUSA)return;const n=t.children.length,w=t.clientWidth;if(n<2||!w)return;t.scrollTo({left:((Math.round(t.scrollLeft/w)+1)%n)*w,behavior:"smooth"})},4500);
document.addEventListener("scroll",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("trk")){const i=Math.round(t.scrollLeft/(t.clientWidth||1));t.parentNode.querySelectorAll(".dots i").forEach((x,k)=>x.classList.toggle("on",k===i))}},true);
